# Render Blueprint — MaelEnglish (Next.js, Node 22).
# Secrets are marked `sync: false`: Render asks for their values when the
# Blueprint is applied; set them in the dashboard (Environment), never in git.
# Plan: choose a paid instance (e.g. Starter) — the free plan sleeps after
# inactivity, which makes the first visit very slow.
services:
  - type: web
    name: maelenglish
    runtime: node
    region: frankfurt # closest Render region to West Africa
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_TZ
        value: Africa/Ouagadougou
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Required
      - key: APP_DB # mongodb+srv://…/maelenglish (dedicated database)
        sync: false
      - key: APP_URL # https://your-final-domain (no trailing slash)
        sync: false
      # Email (Brevo SMTP) — activation / reset links, enrolment emails
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      # File storage (Cloudflare R2, S3 API) — recordings and course audio. Exactly these names.
      # The bucket's CORS must allow GET and PUT from APP_URL. Check with: npm run check:storage
      - key: STORAGE_ENDPOINT # https://<account-id>.r2.cloudflarestorage.com (no bucket name)
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      # WhatsApp Cloud API — enrolment notifications only (optional)
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: "226"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION # e.g. westeurope
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: DAILY_API_KEY # coaching live sessions (Daily Prebuilt)
        sync: false
      - key: CINETPAY_API_KEY # online payments (Shop)
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
      - key: NEXT_PUBLIC_PROGRAM_URL # diagnostic report CTA — read at BUILD time (redeploy after changing it)
        sync: false
